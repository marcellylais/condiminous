services:
  db-moradores:
    image: postgres:16-alpine
    container_name: db-moradores
    environment:
      POSTGRES_USER: ${MORADORES_DB_USER}
      POSTGRES_PASSWORD: ${MORADORES_DB_PASSWORD}
      POSTGRES_DB: ${MORADORES_DB_NAME}
    volumes:
      - moradores_data:/var/lib/postgresql/data
      - ./moradores/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Só para desenvolvimento local (rodar o serviço fora do Docker).
      # Remover quando o serviço entrar no compose.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MORADORES_DB_USER} -d ${MORADORES_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - condiminous-net

  db-espacos:
    image: postgres:16-alpine
    container_name: db-espacos
    environment:
      POSTGRES_USER: ${ESPACOS_DB_USER}
      POSTGRES_PASSWORD: ${ESPACOS_DB_PASSWORD}
      POSTGRES_DB: ${ESPACOS_DB_NAME}
    volumes:
      - espacos_data:/var/lib/postgresql/data
      - ./espacos-comuns/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Só para desenvolvimento local. Remover quando o serviço entrar no compose.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ESPACOS_DB_USER} -d ${ESPACOS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - condiminous-net
  moradores-service:
    build:
      context: ./moradores
    container_name: moradores-service
    restart: unless-stopped
    environment:
      MORADORES_DB_HOST: db-moradores
      MORADORES_DB_PORT: "5432"
      MORADORES_DB_NAME: ${MORADORES_DB_NAME}
      MORADORES_DB_USER: ${MORADORES_DB_USER}
      MORADORES_DB_PASSWORD: ${MORADORES_DB_PASSWORD}
    depends_on:
      db-moradores:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - condiminous-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "check_port_connectivity"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks:
      - condiminous-net
  
  espacos-service:
    build:
      context: ./espacos-comuns
    container_name: espacos-service
    restart: unless-stopped
    environment:
      PORT: "8001"
      ESPACOS_DB_HOST: db-espacos
      ESPACOS_DB_PORT: "5432"
      ESPACOS_DB_NAME: ${ESPACOS_DB_NAME}
      ESPACOS_DB_USER: ${ESPACOS_DB_USER}
      ESPACOS_DB_PASSWORD: ${ESPACOS_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      db-espacos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8001/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - condiminous-net
  
  api-gateway:
    image: nginx:1.27-alpine
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      espacos-service:
        condition: service_healthy
      moradores-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/gateway/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - condiminous-net

  # ===== Observabilidade =====
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - moradores-service
      - espacos-service
    networks:
      - condiminous-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/condiminous.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - condiminous-net

volumes:
  moradores_data:
  espacos_data:
  rabbitmq_data:

networks:
  condiminous-net: