events {
}

http {
    upstream espacos_upstream {
        server espacos-service:8001;
    }
    upstream moradores_upstream {
        server moradores-service:8000;
    }

    server {
        listen 80;
        server_name _;

        location /api/moradores {
            rewrite ^/api(/.*)$ $1 break;

            proxy_pass http://moradores_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health/moradores {
            proxy_pass http://moradores_upstream/health;
            proxy_http_version 1.1;
        }

        location = /metrics/moradores {
            proxy_pass http://moradores_upstream/metrics;
            proxy_http_version 1.1;
        }

        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        location /api/espacos {
            rewrite ^/api(/.*)$ $1 break;

            proxy_pass http://espacos_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health/espacos {
            proxy_pass http://espacos_upstream/health;
            proxy_http_version 1.1;
        }

        location = /metrics/espacos {
            proxy_pass http://espacos_upstream/metrics;
            proxy_http_version 1.1;
        }

        location / {
            default_type application/json;
            return 404 '{"erro":"Rota não encontrada no API Gateway."}';
        }
    }
}